{% extends 'layout.html' %} 
{% block content %} 
<div class="main-wrapper"> 
     <div class="glass-card" style="text-align: center; max-width: 450px; margin: 0 auto; animation: fadeIn 0.5s ease-out;"> 
         <h1 style="font-weight:800; margin-bottom:10px; letter-spacing: -1px; text-transform: uppercase;">NUEVA CUENTA</h1> 
         <p style="margin-bottom:30px; opacity:0.6; font-size: 0.9rem;">Únete a la terminal estudiantil</p> 
                  
         <form method="POST" enctype="multipart/form-data" id="registro-form" class="auth-form"> 
             
             <!-- Nombre de Usuario -->
             <div class="input-group">
                 <label>Nombre de Usuario</label>
                 <input type="text" name="usuario" placeholder="Elige un nombre de usuario" maxlength="20" required autocomplete="username"> 
             </div>
             
             <!-- Contraseña con Mostrar/Ocultar -->
             <div class="input-group">
                 <label>Contraseña</label>
                 <div style="position: relative; display: flex; align-items: center;">
                     <input type="password" name="password" id="password" placeholder="Mínimo 8 caracteres" required autocomplete="new-password" style="padding-right: 45px;"> 
                     <button type="button" onclick="togglePassword()" 
                             style="position: absolute; right: 12px; background: none; border: none; color: white; opacity: 0.4; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: 0.3s; padding: 5px;">
                        <svg id="eye_icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" viewBox="0 0 16 16">
                            <path d="M16 8s-3-5.5-8-5.5S0 8 0 8s3 5.5 8 5.5S16 8 16 8zM1.173 8a13.133 13.133 0 0 1 1.66-2.043C4.12 4.668 5.88 3.5 8 3.5c2.12 0 3.879 1.168 5.168 2.457A13.133 13.133 0 0 1 14.828 8c-.058.087-.122.183-.195.288-.335.48-.83 1.12-1.465 1.755C11.879 11.332 10.119 12.5 8 12.5c-2.12 0-3.879-1.168-5.168-2.457A13.134 13.134 0 0 1 1.172 8z"/>
                            <path d="M8 5.5a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5zM4.5 8a3.5 3.5 0 1 1 7 0 3.5 3.5 0 0 1-7 0z"/>
                        </svg>
                     </button>
                 </div>
             </div>

             <!-- Correo Electrónico -->
             <div class="input-group">
                 <label>Correo Electrónico</label>
                 <input type="email" name="email" placeholder="ejemplo@correo.com" required autocomplete="email"> 
             </div>

             <!-- Fecha de Cumpleaños -->
             <div class="input-group">
                 <label>Fecha de Cumpleaños</label>
                 <input type="date" name="cumpleanos" required style="color-scheme: dark;"> 
             </div>

             <!-- Foto de Perfil -->
             <div class="input-group">
                 <label>Foto de Perfil</label>
                 <div class="file-upload-container">
                     <label for="input-archivo" class="upload-zone" id="label-archivo">
                         <div id="preview-container" style="display: none; margin-bottom: 10px;">
                             <img id="img-preview" src="" style="width: 50px; height: 50px; border-radius: 50%; object-fit: cover; border: 2px solid var(--accent);">
                         </div>
                         <span class="upload-icon">📁</span>
                         <span id="texto-archivo" class="upload-text">Subir desde la computadora</span>
                         <span class="upload-hint">Archivos .jpg, .png o .jpeg</span>
                     </label>
                     <input type="file" name="foto_perfil" id="input-archivo" accept="image/*" style="display: none;">
                 </div>
             </div>

             <button type="submit" class="btn-main" style="margin-top: 10px; background: var(--success); width: 100%; font-weight: 800; padding: 15px;">
                 CREAR MI CUENTA
             </button> 
         </form> 
                  
         <p style="margin-top:30px; font-size: 0.9rem; opacity: 0.7;"> 
             ¿Ya eres miembro? <a href="{{ url_for('login') }}" style="color:var(--accent); text-decoration:none; font-weight:800; border-bottom: 1px solid transparent; transition: 0.3s;" onmouseover="this.style.borderBottom='1px solid var(--accent)'" onmouseout="this.style.borderBottom='1px solid transparent'">Inicia sesión</a> 
         </p> 
     </div> 
</div> 

<style>
    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .auth-form {
        display: flex;
        flex-direction: column;
        gap: 18px;
    }
    .input-group {
        text-align: left;
    }
    .input-group label {
        display: block;
        font-size: 0.7rem;
        font-weight: 800;
        opacity: 0.5;
        text-transform: uppercase;
        margin-bottom: 6px;
        margin-left: 5px;
    }
    .input-group input {
        width: 100%;
        padding: 14px;
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid var(--glass-border);
        border-radius: 12px;
        color: var(--text);
        font-size: 0.95rem;
        outline: none;
        transition: 0.3s;
    }
    .input-group input:focus {
        border-color: var(--accent);
        background: rgba(255, 255, 255, 0.08);
        box-shadow: 0 0 15px rgba(56, 189, 248, 0.15);
    }
    .upload-zone {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 20px;
        border: 2px dashed var(--glass-border);
        border-radius: 16px;
        background: rgba(255, 255, 255, 0.02);
        cursor: pointer;
        transition: all 0.3s ease;
    }
    .upload-zone:hover {
        border-color: var(--accent);
        background: rgba(56, 189, 248, 0.05);
    }
    .upload-icon { font-size: 1.5rem; margin-bottom: 5px; }
    .upload-text { font-weight: 700; font-size: 0.85rem; color: var(--accent); }
    .upload-hint { font-size: 0.7rem; opacity: 0.5; margin-top: 4px; }
    
    .upload-active {
        border-color: var(--success) !important;
        background: rgba(46, 213, 115, 0.05) !important;
    }

    .btn-main:active {
        transform: scale(0.98);
    }
</style>

<script>
// Función para mostrar/ocultar contraseña
function togglePassword() {
    const passwordField = document.getElementById('password');
    const eyeIcon = document.getElementById('eye_icon');
    
    if (passwordField.type === 'password') {
        passwordField.type = 'text';
        eyeIcon.innerHTML = '<path d="M13.359 11.238C15.06 9.72 16 8 16 8s-3-5.5-8-5.5a7.028 7.028 0 0 0-2.79.588l.77.771A5.944 5.944 0 0 1 8 3.5c2.12 0 3.879 1.168 5.168 2.457A13.134 13.134 0 0 1 14.828 8c-.058.087-.122.183-.195.288-.335.48-.83 1.12-1.465 1.755-.165.165-.337.328-.517.486l.708.709z"/><path d="M11.297 9.176a3.5 3.5 0 0 0-4.474-4.474l.823.823a2.5 2.5 0 0 1 2.828 2.829l.823.822zm-4.12 1.91l-1.283-1.283A11.347 11.347 0 0 1 1.172 8c.056-.086.12-.18.192-.284C1.7 7.238 2.196 6.6 2.831 5.966c.21-.21.432-.415.666-.604l-.708-.708A12.63 12.63 0 0 0 1.173 8s3 5.5 8 5.5a7.028 7.028 0 0 0 2.79-.588l-.77-.771A5.944 5.944 0 0 1 8 12.5c-2.12 0-3.879-1.168-5.168-2.457A13.134 13.134 0 0 1 1.172 8z"/><path d="M8 5.5a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5zM4.5 8a3.5 3.5 0 1 1 7 0 3.5 3.5 0 0 1-7 0z"/><path d="M1 1l14 14"/>';
    } else {
        passwordField.type = 'password';
        eyeIcon.innerHTML = '<path d="M16 8s-3-5.5-8-5.5S0 8 0 8s3 5.5 8 5.5S16 8 16 8zM1.173 8a13.133 13.133 0 0 1 1.66-2.043C4.12 4.668 5.88 3.5 8 3.5c2.12 0 3.879 1.168 5.168 2.457A13.133 13.133 0 0 1 14.828 8c-.058.087-.122.183-.195.288-.335.48-.83 1.12-1.465 1.755C11.879 11.332 10.119 12.5 8 12.5c-2.12 0-3.879-1.168-5.168-2.457A13.134 13.134 0 0 1 1.172 8z"/><path d="M8 5.5a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5zM4.5 8a3.5 3.5 0 1 1 7 0 3.5 3.5 0 0 1-7 0z"/>';
    }
}

document.getElementById('registro-form').addEventListener('submit', function(e) {
    const usuario = this.querySelector('input[name="usuario"]');
    const password = this.querySelector('input[name="password"]');
    const commonPasswords = ['123456', 'password', 'qwerty', 'admin123', '12345678'];
    
    const userVal = usuario.value.trim();
    const passVal = password.value;

    if (userVal.length < 3) {
        e.preventDefault();
        alert("El nombre de usuario es demasiado corto.");
        return;
    }

    if (passVal.length < 8) {
        e.preventDefault();
        alert("Seguridad baja: La contraseña debe tener al menos 8 caracteres.");
        return;
    }

    if (passVal.toLowerCase() === userVal.toLowerCase()) {
        e.preventDefault();
        alert("Seguridad baja: La contraseña no puede ser igual al nombre de usuario.");
        return;
    }

    if (commonPasswords.includes(passVal.toLowerCase())) {
        e.preventDefault();
        alert("Seguridad insuficiente: Por favor, utiliza una clave más compleja.");
        return;
    }
});

// Interacción del Input de Archivo con Previsualización
const inputArchivo = document.getElementById('input-archivo');
const labelArchivo = document.getElementById('label-archivo');
const textoArchivo = document.getElementById('texto-archivo');
const previewContainer = document.getElementById('preview-container');
const imgPreview = document.getElementById('img-preview');

inputArchivo.addEventListener('change', function() {
    if(this.files && this.files.length > 0) {
        const file = this.files[0];
        const nombreCorte = file.name.length > 25 
            ? file.name.substring(0, 22) + "..." 
            : file.name;
            
        textoArchivo.innerText = "Archivo: " + nombreCorte;
        labelArchivo.classList.add('upload-active');

        // Previsualización de imagen
        const reader = new FileReader();
        reader.onload = function(e) {
            imgPreview.src = e.target.result;
            previewContainer.style.display = 'block';
        }
        reader.readAsDataURL(file);
    } else {
        textoArchivo.innerText = "Subir desde la computadora";
        labelArchivo.classList.remove('upload-active');
        previewContainer.style.display = 'none';
    }
});
</script>
{% endblock %}
